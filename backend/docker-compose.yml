services:
  postgres:
    image: postgres:16-alpine
    container_name: hp-forum-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hp_forum
      POSTGRES_USER: hp_forum
      POSTGRES_PASSWORD: changeMe
    labels:
      - "org.springframework.boot.service-connection=postgresql"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hp_forum"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
