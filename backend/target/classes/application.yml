spring:
  application:
    name: hp-forum-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/hp_forum
    username: hp_forum
    password: changeMe
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"

logging:
  level:
    org.springframework: info
