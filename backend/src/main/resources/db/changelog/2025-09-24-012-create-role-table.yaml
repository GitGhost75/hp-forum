databaseChangeLog:
  - changeSet:
      id: 2025-09-24-012-create-role-table
      author: codex
      changes:
        - createTable:
            tableName: role
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2048)
              - column:
                  name: created_by_user_id
                  type: UUID
              - column:
                  name: created_by_username
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_modified_by_user_id
                  type: UUID
              - column:
                  name: last_modified_by_username
                  type: VARCHAR(255)
              - column:
                  name: last_modified_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: version
                  type: BIGINT
