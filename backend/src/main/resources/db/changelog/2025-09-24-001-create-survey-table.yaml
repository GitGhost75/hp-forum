databaseChangeLog:
  - changeSet:
      id: 2025-09-24-001-create-survey-table
      author: codex
      changes:
        - createTable:
            tableName: survey
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: survey_number
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: short_description
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: long_description
                  type: VARCHAR(8192)
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: response_deadline
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_by_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: topic_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: survey_category_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: decision_key_id
                  type: UUID
              - column:
                  name: total_amount_gross
                  type: NUMERIC(15, 2)
              - column:
                  name: person_days
                  type: INTEGER
              - column:
                  name: daily_rate_gross
                  type: NUMERIC(12, 2)
              - column:
                  name: recurring_costs_gross_pa
                  type: NUMERIC(15, 2)
              - column:
                  name: activation_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: closure_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: archive_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: extended_deadline
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            comment: Enforce valid survey statuses
            sql: >-
              ALTER TABLE survey
              ADD CONSTRAINT ck_survey_status
              CHECK (status IN ('draft','active','active_extended','active_overdue','closed','completed','cancelled','archived'));
