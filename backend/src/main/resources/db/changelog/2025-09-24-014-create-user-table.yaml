databaseChangeLog:
  - changeSet:
      id: 2025-09-24-014-create-user-table
      author: codex
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_by_user_id
                  type: UUID
              - column:
                  name: created_by_username
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_modified_by_user_id
                  type: UUID
              - column:
                  name: last_modified_by_username
                  type: VARCHAR(255)
              - column:
                  name: last_modified_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: version
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: app_user
            baseColumnNames: organization_id
            referencedTableName: organization
            referencedColumnNames: id
            constraintName: fk_user_organization
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: app_user
            baseColumnNames: role_id
            referencedTableName: role
            referencedColumnNames: id
            constraintName: fk_user_role
            onDelete: RESTRICT
