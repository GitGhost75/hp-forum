databaseChangeLog:
  - changeSet:
      id: 2025-09-24-003-create-survey-category-table
      author: codex
      changes:
        - createTable:
            tableName: survey_category
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2048)
              - column:
                  name: created_by_user_id
                  type: UUID
              - column:
                  name: created_by_username
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_modified_by_user_id
                  type: UUID
              - column:
                  name: last_modified_by_username
                  type: VARCHAR(255)
              - column:
                  name: last_modified_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: version
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: survey
            baseColumnNames: survey_category_id
            referencedTableName: survey_category
            referencedColumnNames: id
            constraintName: fk_survey_category
            onDelete: RESTRICT
