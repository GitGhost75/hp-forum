databaseChangeLog:
  - changeSet:
      id: 2025-09-24-002-create-survey-audit-tables
      author: codex
      changes:
        - createSequence:
            sequenceName: revinfo_seq
            startValue: 1
            incrementBy: 50
        - createTable:
            tableName: revinfo
            columns:
              - column:
                  name: rev
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: revtstmp
                  type: BIGINT
                  constraints:
                    nullable: false
        - createTable:
            tableName: survey_aud
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: SMALLINT
                  constraints:
                    nullable: false
              - column:
                  name: survey_number
                  type: VARCHAR(64)
              - column:
                  name: survey_number_mod
                  type: BOOLEAN
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: name_mod
                  type: BOOLEAN
              - column:
                  name: short_description
                  type: VARCHAR(1024)
              - column:
                  name: short_description_mod
                  type: BOOLEAN
              - column:
                  name: long_description
                  type: VARCHAR(8192)
              - column:
                  name: long_description_mod
                  type: BOOLEAN
              - column:
                  name: status
                  type: VARCHAR(32)
              - column:
                  name: status_mod
                  type: BOOLEAN
              - column:
                  name: response_deadline
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: response_deadline_mod
                  type: BOOLEAN
              - column:
                  name: topic_id
                  type: UUID
              - column:
                  name: topic_id_mod
                  type: BOOLEAN
              - column:
                  name: survey_category_id
                  type: UUID
              - column:
                  name: survey_category_id_mod
                  type: BOOLEAN
              - column:
                  name: decision_key_id
                  type: UUID
              - column:
                  name: decision_key_id_mod
                  type: BOOLEAN
              - column:
                  name: total_amount_gross
                  type: NUMERIC(15, 2)
              - column:
                  name: total_amount_gross_mod
                  type: BOOLEAN
              - column:
                  name: person_days
                  type: INTEGER
              - column:
                  name: person_days_mod
                  type: BOOLEAN
              - column:
                  name: daily_rate_gross
                  type: NUMERIC(12, 2)
              - column:
                  name: daily_rate_gross_mod
                  type: BOOLEAN
              - column:
                  name: recurring_costs_gross_pa
                  type: NUMERIC(15, 2)
              - column:
                  name: recurring_costs_gross_pa_mod
                  type: BOOLEAN
              - column:
                  name: activation_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: activation_date_mod
                  type: BOOLEAN
              - column:
                  name: closure_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: closure_date_mod
                  type: BOOLEAN
              - column:
                  name: archive_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: archive_date_mod
                  type: BOOLEAN
              - column:
                  name: extended_deadline
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: extended_deadline_mod
                  type: BOOLEAN
              - column:
                  name: created_by_user_id
                  type: UUID
              - column:
                  name: created_by_username
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_modified_by_user_id
                  type: UUID
              - column:
                  name: last_modified_by_username
                  type: VARCHAR(255)
              - column:
                  name: last_modified_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: version
                  type: BIGINT
              - column:
                  name: created_by_mod
                  type: BOOLEAN
              - column:
                  name: created_date_mod
                  type: BOOLEAN
              - column:
                  name: last_modified_by_mod
                  type: BOOLEAN
              - column:
                  name: last_modified_date_mod
                  type: BOOLEAN
              - column:
                  name: version_mod
                  type: BOOLEAN
        - addPrimaryKey:
            tableName: survey_aud
            columnNames: id, rev
            constraintName: pk_survey_aud
        - addForeignKeyConstraint:
            baseTableName: survey_aud
            baseColumnNames: rev
            constraintName: fk_survey_aud_rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            onDelete: CASCADE
